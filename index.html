<!DOCTYPE html>
<html>
<head>
  <title>City Builder Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: Arial; background: #87CEEB; overflow: hidden; touch-action: none; }
    
    #game {
      position: fixed; width: 100vw; height: 100vh; overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
    }
    
    #mundo {
      position: absolute; transform-origin: 0 0;
    }
    
    /* TILE ISOMÉTRICO */
  .tile {
      position: absolute; width: 128px; height: 64px;
      background: #3d7d3d;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
  .tile.vazio:active { filter: brightness(1.4); }
    
    /* ESTRADA */
  .estrada {
      position: absolute; width: 128px; height: 64px;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      background: #2a2a2a;
    }
  .estrada.h::after {
      content: ''; position: absolute; top: 50%; left: 0; right: 0;
      height: 5px; background: repeating-linear-gradient(90deg, #FFD700 0px, #FFD700 25px, transparent 25px, transparent 40px);
      transform: translateY(-50%) skewY(-26.565deg);
    }
  .estrada.v::after {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 5px; background: repeating-linear-gradient(0deg, #FFD700 0px, #FFD700 25px, transparent 25px, transparent 40px);
      transform: translateX(-50%) skewX(26.565deg);
    }
    
  .faixa {
      position: absolute; width: 128px; height: 64px;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      background: #555;
    }
  .faixa::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 70%; height: 10px; background: repeating-linear-gradient(90deg, #FFF 0px, #FFF 8px, transparent 8px, transparent 16px);
      transform: translate(-50%, -50%) skewX(-26.565deg);
    }
    
    /* PRAÇA PÚBLICA */
  .praca {
      position: absolute; width: 128px; height: 64px;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      background: #c9b037;
    }
  .praca::before {
      content: '🌳⛲🌳'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); font-size: 20px;
    }
    
    /* PRÉDIO CANVAS */
  .building {
      position: absolute; pointer-events: none;
      transform: translate(-50%, -100%);
    }
    
  .building-canvas {
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%);
      image-rendering: pixelated;
    }
    
  .carro {
      position: absolute; width: 28px; height: 16px; z-index: 100;
      transform: translate(-50%, -50%);
      transition: all 0.12s linear; pointer-events: none;
      border-radius: 5px; border: 2px solid #000;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
    }
    
  .pedestre {
      position: absolute; width: 7px; height: 7px; z-index: 90;
      transform: translate(-50%, -50%);
      background: #222; border-radius: 50%;
      transition: all 0.6s linear; pointer-events: none;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }

    #hud {
      position: fixed; top: 15px; left: 15px; right: 15px; z-index: 200;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    #dinheiro, #populacao {
      background: rgba(0,0,0,0.9); padding: 14px 22px; border-radius: 16px; 
      font-weight: bold; border: 4px solid #0F0; backdrop-filter: blur(12px);
      pointer-events: all; box-shadow: 0 6px 25px rgba(0,0,0,0.5);
    }
    #dinheiro { color: #0F0; font-size: 26px; }
    #populacao { color: #FFF; font-size: 22px; border-color: #FFF; }
    
    #btn-comprar {
      position: fixed; bottom: 35px; right: 35px; z-index: 200;
      width: 90px; height: 90px; background: #FF9800; 
      border: 6px solid #FFF; border-radius: 50%; font-size: 48px; 
      color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #btn-comprar:active { transform: scale(0.88); }
    
    #loja {
      position: fixed; bottom: -100%; left: 0; right: 0; z-index: 300;
      background: #1a1a2e; height: 85vh; border-radius: 30px 30px 0 0;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
      overflow-y: auto; padding: 30px;
    }
    #loja.aberta { bottom: 0; }
    #loja-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; color: white; }
    #fechar-loja { background: #f44336; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 30px; }
    
  .categoria { color: #FF9800; font-size: 20px; font-weight: bold; margin: 25px 0 10px 0; }
    
  .item-loja {
      background: #0f0f1e; padding: 20px; margin: 14px 0; border-radius: 16px; 
      display: flex; align-items: center; gap: 20px; border: 3px solid #333;
    }
  .item-loja:active { background: #2a2a4e; transform: scale(0.97); }
  .item-emoji { font-size: 50px; }
  .item-info { flex: 1; color: white; }
  .item-nome { font-size: 22px; font-weight: bold; }
  .item-preco { color: #0F0; font-size: 20px; margin-top: 5px; }
  .item-desc { color: #AAA; font-size: 14px; margin-top: 7px; }
    
    #menu-construir {
      position: fixed; background: rgba(0,0,0,0.95); padding: 22px;
      border-radius: 16px; z-index: 250; display: none;
      border: 4px solid #4CAF50; backdrop-filter: blur(15px);
    }
    #menu-construir button {
      display: block; width: 260px; padding: 18px; margin: 12px 0;
      background: #4CAF50; color: white; border: none; border-radius: 12px;
      font-size: 18px; font-weight: bold;
    }
    
    #toast {
      position: fixed; top: 110px; left: 50%; transform: translateX(-50%);
      background: #f44336; color: white; padding: 16px 32px;
      border-radius: 32px; z-index: 400; display: none; font-weight: bold;
      box-shadow: 0 6px 25px rgba(0,0,0,0.4); font-size: 17px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="mundo"></div>
  </div>

  <div id="hud">
    <div id="dinheiro">$ 1.000.000</div>
    <div id="populacao">👥 0</div>
  </div>

  <button id="btn-comprar">🏗️</button>
  <div id="toast"></div>

  <div id="loja">
    <div id="loja-header">
      <h2>Loja de Construção</h2>
      <button id="fechar-loja">×</button>
    </div>
    <div id="lista-itens"></div>
  </div>

  <div id="menu-construir">
    <button onclick="construirAqui('estrada_h')">🛣️ Rua Horizontal</button>
    <button onclick="construirAqui('estrada_v')">🛣️ Rua Vertical</button>
    <button onclick="construirAqui('faixa')">⬜ Faixa Pedestre</button>
    <button onclick="construirAqui('praca')">🌳 Praça Pública</button>
    <button onclick="abrirLojaNoTile()">🏢 Edifício</button>
    <button onclick="fecharMenu()">Cancelar</button>
  </div>

<script>
  const ITENS = [
    { id: 'praca', nome: 'Praça Pública', emoji: '🌳', preco: 500, desc: 'Lazer e árvores', tipo: 'lazer' },
    { id: 'predio_azul', nome: 'Arranha-Céu Vidro', emoji: '🏢', preco: 5000, desc: '+80 população', tipo: 'res', pop: 80, cor: '#4a9eff', h: 450 },
    { id: 'predio_cinza', nome: 'Edifício Comercial', emoji: '🏬', preco: 2000, desc: '+40 população', tipo: 'res', pop: 40, cor: '#888', h: 280 },
    { id: 'hotel', nome: 'Hotel Luxo', emoji: '🏨', preco: 8000, desc: '+$300/dia', tipo: 'com', renda: 300, cor: '#DA70D6', h: 350 },
    { id: 'casa', nome: 'Casa', emoji: '🏠', preco: 300, desc: '+6 população', tipo: 'res', pop: 6, cor: '#CD853F', h: 100 },
    { id: 'hospital', nome: 'Hospital', emoji: '🏥', preco: 4000, desc: 'Saúde +$50/dia', tipo: 'serv', renda: 50, cor: '#FFF', h: 200 },
    { id: 'escola', nome: 'Escola', emoji: '🏫', preco: 2500, desc: 'Educação +$30/dia', tipo: 'serv', renda: 30, cor: '#FFA500', h: 160 },
    { id: 'estadio', nome: 'Estádio', emoji: '🏟️', preco: 15000, desc: '+$500/dia', tipo: 'lazer', renda: 500, cor: '#32CD32', h: 220 },
    { id: 'delegacia', nome: 'Delegacia', emoji: '🚓', preco: 3000, desc: 'Segurança', tipo: 'serv', cor: '#4169E1', h: 120 },
  ];

  let dinheiro = 1000000, populacao = 0, mapa = {};
  let tileSelecionado = null, carros = [], pedestres = [];
  let temEstrada = false;

  const mundoEl = document.getElementById('mundo');
  let scale = 0.45, posX = -1000, posY = -800;
  let isDragging = false, startX, startY;

  function updateTransform() {
    mundoEl.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  }
  updateTransform();

  // Desenha prédio no Canvas
  function desenharPredio(item, canvas) {
    const ctx = canvas.getContext('2d');
    const w = 90, h = item.h;
    canvas.width = w;
    canvas.height = h + 50;
    
    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(15, h+45, w-10, 8);
    
    // Corpo principal
    ctx.fillStyle = item.cor;
    ctx.fillRect(10, 50, w-20, h);
    
    // Sombra lateral direita
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.moveTo(w-10, 50);
    ctx.lineTo(w, 40);
    ctx.lineTo(w, h+40);
    ctx.lineTo(w-10, h+50);
    ctx.closePath();
    ctx.fill();
    
    // Topo
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(10, 50);
    ctx.lineTo(20, 40);
    ctx.lineTo(w-10, 40);
    ctx.lineTo(w-20, 50);
    ctx.closePath();
    ctx.fill();
    
    // Janelas de vidro azul
    if (item.id.includes('predio') || item.id === 'hotel') {
      ctx.fillStyle = 'rgba(100,220,255,0.7)';
      for(let y = 60; y < h+30; y += 22) {
        for(let x = 20; x < w-20; x += 14) {
          ctx.fillRect(x, y, 10, 15);
        }
      }
    } else {
      // Janelas normais
      ctx.fillStyle = 'rgba(255,255,180,0.6)';
      for(let y = 60; y < h+30; y += 25) {
        for(let x = 20; x < w-20; x += 18) {
          ctx.fillRect(x, y, 8, 12);
        }
      }
    }
    
    // Detalhes no topo
    if (item.id === 'predio_azul') {
      ctx.fillStyle = '#666';
      ctx.fillRect(w/2-8, 15, 16, 25);
      ctx.fillStyle = '#999';
      ctx.fillRect(w/2-5, 10, 10, 5);
    }
    if (item.id === 'hotel') {
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(w/2-12, 20, 24, 15);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px Arial';
      ctx.fillText('HOTEL', w/2-12, 32);
    }
  }

  // Grid isométrico
  const TAM = 50;
  for(let y = 0; y < TAM; y++) {
    for(let x = 0; x < TAM; x++) {
      const tile = document.createElement('div');
      tile.className = 'tile vazio';
      const px = (x - y) * 64;
      const py = (x + y) * 32;
      tile.style.left = px + 'px';
      tile.style.top = py + 'px';
      tile.dataset.x = x;
      tile.dataset.y = y;
      tile.dataset.isoX = px;
      tile.dataset.isoY = py;
      tile.onclick = (e) => clicarTile(x, y, e, px, py);
      mundoEl.appendChild(tile);
    }
  }

  // Controles
  mundoEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      startX = e.touches[0].clientX - posX;
      startY = e.touches[0].clientY - posY;
    }
  });
  
  let lastDist = 0;
  mundoEl.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      posX = e.touches[0].clientX - startX;
      posY = e.touches[0].clientY - startY;
      updateTransform();
    }
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (lastDist) {
        scale *= dist / lastDist;
        scale = Math.max(0.2, Math.min(1.2, scale));
        updateTransform();
      }
      lastDist = dist;
    }
  });
  
  mundoEl.addEventListener('touchend', () => {
    isDragging = false;
    lastDist = 0;
  });

  function clicarTile(tx, ty, e, px, py) {
    if (isDragging) return;
    e.stopPropagation();
    tileSelecionado = {x: tx, y: ty, px: px, py: py};
    
    const key = `${tx}_${ty}`;
    if (mapa[key]) return mostrarToast('Terreno ocupado!');
    
    const menu = document.getElementById('menu-construir');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
  }

  function fecharMenu() {
    document.getElementById('menu-construir').style.display = 'none';
  }

  function construirAqui(tipo) {
    fecharMenu();
    construir(tipo, tileSelecionado.x, tileSelecionado.y, tileSelecionado.px, tileSelecionado.py);
  }

  function abrirLojaNoTile() {
    fecharMenu();
    abrirLoja();
  }

  // LOJA
  const lojaEl = document.getElementById('loja');
  document.getElementById('btn-comprar').onclick = abrirLoja;
  document.getElementById('fechar-loja').onclick = () => lojaEl.classList.remove('aberta');

  function abrirLoja() {
    lojaEl.classList.add('aberta');
    renderizarLoja();
  }

  function renderizarLoja() {
    const lista = document.getElementById('lista-itens');
    lista.innerHTML = '<div class="categoria">🏢 EDIFÍCIOS</div>';
    ITENS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item-loja';
      div.innerHTML = `
        <div class="item-emoji">${item.emoji}</div>
        <div class="item-info">
          <div class="item-nome">${item.nome}</div>
          <div class="item-preco">$ ${item.preco.toLocaleString()}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
      `;
      div.onclick = () => {
        if (tileSelecionado) {
          construir(item.id, tileSelecionado.x, tileSelecionado.y, tileSelecionado.px, tileSelecionado.py);
          lojaEl.classList.remove('aberta');
        } else {
          mostrarToast('Clica no terreno primeiro!');
        }
      };
      lista.appendChild(div);
    });
  }

  // CONSTRUIR
  function construir(itemId, tx, ty, px, py) {
    const item = ITENS.find(i => i.id === itemId) || {id: itemId, tipo: 'infra'};
    const key = `${tx}_${ty}`;
    
    if (mapa[key]) return mostrarToast('Terreno ocupado!');
    if (item.preco && dinheiro < item.preco) return mostrarToast('Dinheiro insuficiente!');
    
    if (item.preco) dinheiro -= item.preco;
    mapa[key] = { tipo: item.tipo || 'infra', item: itemId };
    if (item.pop) populacao += item.pop;
    
    const tile = document.querySelector(`[data-x="${tx}"][data-y="${ty}"]`);
    
    if (itemId === 'estrada_h') {
      tile.className = 'estrada h';
      temEstrada = true;
    } else if (itemId === 'estrada_v') {
      tile.className = 'estrada v';
      temEstrada = true;
    } else if (itemId === 'faixa') {
      tile.className = 'faixa';
    } else if (itemId === 'praca') {
      tile.className = 'praca';
    } else {
      const building = document.createElement('div');
      building.className = 'building';
      building.style.left = px + 64 + 'px';
      building.style.top = py + 32 + 'px';
      building.style.zIndex = 2000 - py;
      
      const canvas = document.createElement('canvas');
      canvas.className = 'building-canvas';
      desenharPredio(item, canvas);
      building.appendChild(canvas);
      mundoEl.appendChild(building);
    }
    
    atualizarHUD();
    if (temEstrada) {
      spawnCarro();
      spawnPedestre();
    }
  }

  // CARROS - SÓ SE TIVER ESTRADA
  function spawnCarro() {
    if (!temEstrada || carros.length > 60) return;
    const estradas = Object.keys(mapa).filter(k => mapa[k].item && mapa[k].item.includes('estrada'));
    if (estradas.length < 3) return;
    
    const [x][y] = estradas[Math.floor(Math.random() * estradas.length)].split('_').map(Number);
    const tile = document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
    const px = parseInt(tile.dataset.isoX);
    const py = parseInt(tile.dataset.isoY);
    
    const carro = document.createElement('div');
    carro.className = 'carro';
    carro.style.left = px + 64 + 'px';
    carro.style.top = py + 32 + 'px';
    carro.style.background = ['#F00','#00F','#0F0','#FF0','#FFF','#888'][Math.floor(Math.random()*6)];
    mundoEl.appendChild(carro);
    carros.push({el: carro, x, y, px, py});
  }

  // PEDESTRES - SÓ SE TIVER ESTRADA
  function spawnPedestre() {
    if (!temEstrada || pedestres.length > 100 || populacao < 20) return;
    const estradas = Object.keys(mapa).filter(k => mapa[k].item && mapa[k].item.includes('estrada'));
    if (estradas.length === 0) return;
    
    const [x][y] = estradas[Math.floor(Math.random() * estradas.length)].split('_').map(Number);
    const tile = document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
    const px = parseInt(tile.dataset.isoX);
    const py = parseInt(tile.dataset.isoY);
    
    const pedestre = document.createElement('div');
    pedestre.className = 'pedestre';
    pedestre.style.left = px + 64 + 'px';
    pedestre.style.top = py + 32 + 'px';
    mundoEl.appendChild(pedestre);
    pedestres.push({el: pedestre, x, y, px, py});
  }

  // ANIMAÇÃO
  setInterval(() => {
    if (!temEstrada) return;
    
    carros.forEach(c => {
      const dir = Math.random();
      if (dir < 0.5) c.x += (Math.random() > 0.5? 1 : -1);
      else c.y += (Math.random() > 0.5? 1 : -1);
      
      c.x = Math.max(0, Math.min(TAM-1, c.x));
      c.y = Math.max(0, Math.min(TAM-1, c.y));
      
      const tile = document.querySelector(`[data-x="${Math.round(c.x)}"][data-y="${Math.round(c.y)}"]`);
      if (tile && tile.className.includes('estrada')) {
        c.px = parseInt(tile.dataset.isoX);
        c.py = parseInt(tile.dataset.isoY);
        c.el.style.left = c.px + 64 + 'px';
        c.el.style.top = c.py + 32 + 'px';
      }
    });
    
    pedestres.forEach(p => {
      p.x += (Math.random() - 0.5) * 0.6;
      p.y += (Math.random() - 0.5) * 0.6;
      p.x = Math.max(0, Math.min(TAM-1, p.x));
      p.y = Math.max(0, Math.min(TAM-1, p.y));
      
      const tile = document.querySelector(`[data-x="${Math.round(p.x)}"][data-y="${Math.round(p.y)}"]`);
      if (tile) {
        p.px = parseInt(tile.dataset.isoX);
        p.py = parseInt(tile.dataset.isoY);
        p.el.style.left = p.px + 64 + 'px';
        p.el.style.top = p.py + 32 + 'px';
      }
    });
  }, 80);

  // RENDA
  setInterval(() => {
    let renda = 0;
    Object.values(mapa).forEach(m => {
      const item = ITENS.find(i => i.id === m.item);
      if (item && item.renda) renda += item.renda;
    });
    if (renda > 0) {
      dinheiro += renda;
      atualizarHUD();
    }
    if (temEstrada) {
      spawnCarro();
      spawnPedestre();
    }
  }, 3000);

  function atualizarHUD() {
    document.getElementById('dinheiro').innerText = `$ ${dinheiro.toLocaleString()}`;
    document.getElementById('populacao').innerText = `👥 ${populacao}`;
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#menu-construir') &&!e.target.closest('.tile')) fecharMenu();
  });

  atualizarHUD();
</script>
</body>
</html>
