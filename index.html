<!DOCTYPE html>
<html>
<head>
  <title>City Builder 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { 
      font-family: Arial; background: #87CEEB; overflow: hidden; 
      touch-action: none;
    }
    
    #game {
      position: relative; width: 100vw; height: 100vh; 
      perspective: 1000px; overflow: hidden;
    }
    
    #mundo {
      position: absolute; top: 50%; left: 50%;
      transform-style: preserve-3d;
      transform: rotateX(60deg) rotateZ(45deg) translate(-50%, -50%);
    }
    
    #mapa {
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
    }
    #mapa.dragging { cursor: grabbing; }
    
  .tile {
      position: absolute; width: 60px; height: 60px;
      background: #4a7c2c; border: 1px solid #3a6c1c;
      transform-style: preserve-3d;
    }
  .tile.vazio:hover { filter: brightness(1.3); }
   
  .tile.estrada { background: #2a2a2a; }
  .tile.estrada::after {
      content: ''; position: absolute; top: 50%; left: 10%; right: 10%;
      height: 3px; background: #FFD700; transform: translateY(-50%);
    }
    
  .edificio {
      position: absolute; width: 60px; height: 60px;
      transform-style: preserve-3d; pointer-events: none;
    }
  .edificio.base {
      position: absolute; width: 60px; height: 60px;
      background: #666; transform: translateZ(0px);
    }
  .edificio.parede {
      position: absolute; background: #888;
      transform-origin: bottom;
    }
  .edificio.frente {
      width: 60px; height: 80px; 
      transform: rotateX(-90deg) translateZ(30px);
      background: linear-gradient(#999, #666);
      display: flex; align-items: center; justify-content: center;
      font-size: 35px;
    }
  .edificio.lado {
      width: 60px; height: 80px;
      transform: rotateX(-90deg) rotateY(90deg) translateZ(30px);
      background: linear-gradient(#777, #444);
    }
  .edificio.topo {
      width: 60px; height: 60px;
      transform: translateZ(80px);
      background: #555;
    }
    
  .edificio.casa.frente { height: 50px; background: linear-gradient(#8B4513, #654321); }
  .edificio.casa.lado { height: 50px; background: linear-gradient(#6B3410, #543210); }
  .edificio.casa.topo { transform: translateZ(50px); background: #A0522D; }
   
  .edificio.predio.frente { height: 150px; background: linear-gradient(#5a9bd4, #3a6ba4); }
  .edificio.predio.lado { height: 150px; background: linear-gradient(#4a8bc4, #2a5b94); }
  .edificio.predio.topo { transform: translateZ(150px); background: #2a4b84; }
   
  .edificio.hospital.frente { height: 90px; background: linear-gradient(#FFF, #DDD); }
  .edificio.hospital.lado { height: 90px; background: linear-gradient(#EEE, #CCC); }
  .edificio.hospital.topo { transform: translateZ(90px); background: #F00; }
    
  .carro {
      position: absolute; font-size: 20px; z-index: 100;
      transition: all 0.1s linear; pointer-events: none;
      transform: translateZ(5px) rotateZ(-45deg);
    }
  .pedestre {
      position: absolute; font-size: 14px; z-index: 90;
      transition: all 0.5s linear; pointer-events: none;
      transform: translateZ(2px) rotateZ(-45deg);
    }

    #hud {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 200;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    #dinheiro, #populacao {
      background: rgba(0,0,0,0.85); padding: 12px 18px;
      border-radius: 12px; font-weight: bold; border: 2px solid #0F0;
      pointer-events: all; backdrop-filter: blur(5px);
    }
    #dinheiro { color: #0F0; font-size: 22px; }
    #populacao { color: #FFF; font-size: 18px; border-color: #FFF; }
    
    #btn-comprar {
      position: fixed; bottom: 25px; right: 25px; z-index: 200;
      width: 75px; height: 75px; background: #4CAF50; 
      border: 4px solid #FFF; border-radius: 50%; 
      font-size: 40px; color: white; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #btn-comprar:active { transform: scale(0.9); }
    
    #loja {
      position: fixed; bottom: -100%; left: 0; right: 0; z-index: 300;
      background: #1a1a2e; height: 75vh; border-radius: 25px 25px 0 0;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
      overflow-y: auto; padding: 25px;
    }
    #loja.aberta { bottom: 0; }
    #loja-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; color: white;
    }
    #fechar-loja {
      background: #f44336; color: white; border: none;
      width: 40px; height: 40px; border-radius: 50%; font-size: 24px;
    }
    
  .item-loja {
      background: #0f0f1e; padding: 18px; margin: 12px 0;
      border-radius: 12px; display: flex; align-items: center; gap: 18px;
      border: 2px solid #333; transition: all 0.2s;
    }
  .item-loja:active { background: #2a2a4e; transform: scale(0.98); }
  .item-emoji { font-size: 45px; }
  .item-info { flex: 1; color: white; }
  .item-nome { font-size: 20px; font-weight: bold; }
  .item-preco { color: #0F0; font-size: 18px; margin-top: 3px; }
  .item-desc { color: #AAA; font-size: 13px; margin-top: 5px; }
    
    #menu-construir {
      position: fixed; background: rgba(0,0,0,0.95); padding: 18px;
      border-radius: 12px; z-index: 250; display: none;
      border: 3px solid #4CAF50; backdrop-filter: blur(10px);
    }
    #menu-construir button {
      display: block; width: 220px; padding: 14px; margin: 8px 0;
      background: #4CAF50; color: white; border: none; border-radius: 8px;
      font-size: 17px; font-weight: bold;
    }
    #menu-construir button:active { background: #45a049; }
    
    #toast {
      position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
      background: #f44336; color: white; padding: 12px 25px;
      border-radius: 25px; z-index: 400; display: none; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="mundo">
      <div id="mapa"></div>
    </div>
  </div>

  <div id="hud">
    <div id="dinheiro">$ 1.000</div>
    <div id="populacao">👥 0</div>
  </div>

  <button id="btn-comprar">🏗️</button>
  <div id="toast"></div>

  <div id="loja">
    <div id="loja-header">
      <h2>Loja de Construção</h2>
      <button id="fechar-loja">×</button>
    </div>
    <div id="lista-itens"></div>
  </div>

  <div id="menu-construir">
    <button onclick="construirAqui('estrada')">🛣️ Estrada</button>
    <button onclick="abrirLojaNoTile()">🏢 Edifício</button>
    <button onclick="fecharMenu()">Cancelar</button>
  </div>

<script>
  const ITENS = [
    { id: 'estrada', nome: 'Estrada', emoji: '🛣️', preco: 10, desc: 'Conecta a cidade', tipo: 'infra' },
    { id: 'casa', nome: 'Casa', emoji: '🏠', preco: 100, desc: '+4 população', tipo: 'res', pop: 4, altura: 50 },
    { id: 'predio', nome: 'Prédio', emoji: '🏢', preco: 500, desc: '+20 população', tipo: 'res', pop: 20, altura: 150 },
    { id: 'escola', nome: 'Escola', emoji: '🏫', preco: 800, desc: 'Educação', tipo: 'serv', altura: 80 },
    { id: 'hospital', nome: 'Hospital', emoji: '🏥', preco: 1200, desc: 'Saúde', tipo: 'serv', altura: 90 },
    { id: 'delegacia', nome: 'Delegacia', emoji: '🚓', preco: 900, desc: 'Segurança', tipo: 'serv', altura: 70 },
    { id: 'hotel', nome: 'Hotel', emoji: '🏨', preco: 1500, desc: '+$50/dia', tipo: 'com', renda: 50, altura: 120 },
    { id: 'lanchonete', nome: 'Lanchonete', emoji: '🍔', preco: 300, desc: '+$20/dia', tipo: 'com', renda: 20, altura: 60 },
    { id: 'restaurante', nome: 'Restaurante', emoji: '🍽️', preco: 600, desc: '+$40/dia', tipo: 'com', renda: 40, altura: 70 },
    { id: 'fazenda', nome: 'Fazenda', emoji: '🚜', preco: 400, desc: '+$30/dia', tipo: 'com', renda: 30, altura: 40 },
    { id: 'estadio', nome: 'Estádio', emoji: '🏟️', preco: 5000, desc: '+$200/dia', tipo: 'lazer', renda: 200, altura: 100 }
  ];

  let dinheiro = 1000, populacao = 0, mapa = {};
  let tileSelecionado = null, carros = [], pedestres = [];

  // MAPA ISOMÉTRICO
  const mundoEl = document.getElementById('mundo');
  const mapaEl = document.getElementById('mapa');
  let scale = 0.8, rotZ = 45, posX = 0, posY = 0;
  let isDragging = false, startX, startY;

  function updateMundo() {
    mundoEl.style.transform = `rotateX(60deg) rotateZ(${rotZ}deg) translate(${posX}px, ${posY}px) scale(${scale})`;
  }
  updateMundo();

  // Gerar grid 30x30
  const TAM = 30;
  for(let i = 0; i < TAM; i++) {
    for(let j = 0; j < TAM; j++) {
      const tile = document.createElement('div');
      tile.className = 'tile vazio';
      tile.style.left = i * 60 + 'px';
      tile.style.top = j * 60 + 'px';
      tile.dataset.x = i;
      tile.dataset.y = j;
      tile.onclick = (e) => clicarTile(i, j, e);
      mapaEl.appendChild(tile);
    }
  }

  // Pan
  mapaEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      startX = e.touches[0].clientX - posX;
      startY = e.touches[0].clientY - posY;
      mapaEl.classList.add('dragging');
    }
  });
  mapaEl.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      posX = e.touches[0].clientX - startX;
      posY = e.touches[0].clientY - startY;
      updateMundo();
    }
    // Zoom
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (window.lastDist) {
        scale *= dist / window.lastDist;
        scale = Math.max(0.4, Math.min(1.5, scale));
        updateMundo();
      }
      window.lastDist = dist;
    }
  });
  mapaEl.addEventListener('touchend', () => {
    isDragging = false;
    window.lastDist = 0;
    mapaEl.classList.remove('dragging');
  });

  function clicarTile(tx, ty, e) {
    if (isDragging) return;
    e.stopPropagation();
    tileSelecionado = {x: tx, y: ty};
    
    const key = `${tx}_${ty}`;
    if (mapa[key]) return mostrarToast('Terreno ocupado!');
    
    const menu = document.getElementById('menu-construir');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
  }

  function fecharMenu() {
    document.getElementById('menu-construir').style.display = 'none';
  }

  function construirAqui(tipo) {
    fecharMenu();
    if (tipo === 'estrada') construir('estrada', tileSelecionado.x, tileSelecionado.y);
  }

  function abrirLojaNoTile() {
    fecharMenu();
    abrirLoja();
  }

  // LOJA
  const lojaEl = document.getElementById('loja');
  document.getElementById('btn-comprar').onclick = abrirLoja;
  document.getElementById('fechar-loja').onclick = () => lojaEl.classList.remove('aberta');

  function abrirLoja() {
    lojaEl.classList.add('aberta');
    renderizarLoja();
  }

  function renderizarLoja() {
    const lista = document.getElementById('lista-itens');
    lista.innerHTML = '';
    ITENS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item-loja';
      div.innerHTML = `
        <div class="item-emoji">${item.emoji}</div>
        <div class="item-info">
          <div class="item-nome">${item.nome}</div>
          <div class="item-preco">$ ${item.preco}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
      `;
      div.onclick = () => {
        if (tileSelecionado) {
          construir(item.id, tileSelecionado.x, tileSelecionado.y);
          lojaEl.classList.remove('aberta');
        } else {
          mostrarToast('Clica no terreno primeiro!');
        }
      };
      lista.appendChild(div);
    });
  }

  // CONSTRUIR 3D
  function construir(itemId, tx, ty) {
    const item = ITENS.find(i => i.id === itemId);
    const key = `${tx}_${ty}`;
    
    if (mapa[key]) return mostrarToast('Terreno ocupado!');
    if (dinheiro < item.preco) return mostrarToast('Dinheiro insuficiente!');
    
    dinheiro -= item.preco;
    mapa[key] = { tipo: item.tipo, item: itemId };
    if (item.pop) populacao += item.pop;
    
    const tile = document.querySelector(`[data-x="${tx}"][data-y="${ty}"]`);
    
    if (itemId === 'estrada') {
      tile.className = 'tile estrada';
    } else {
      const edificio = document.createElement('div');
      edificio.className = `edificio ${itemId}`;
      edificio.style.left = tx * 60 + 'px';
      edificio.style.top = ty * 60 + 'px';
      
      const altura = item.altura || 80;
      edificio.innerHTML = `
        <div class="base"></div>
        <div class="parede frente" style="height:${altura}px">${item.emoji}</div>
        <div class="parede lado" style="height:${altura}px"></div>
        <div class="topo" style="transform:translateZ(${altura}px)"></div>
      `;
      mapaEl.appendChild(edificio);
      tile.className = 'tile ocupado';
    }
    
    atualizarHUD();
    spawnCarro();
    spawnPedestre();
  }

  // CARROS
  function spawnCarro() {
    if (carros.length > 12) return;
    const estradas = Object.keys(mapa).filter(k => mapa[k].tipo === 'infra');
    if (estradas.length < 2) return;
    
    const [x, y] = estradas[Math.floor(Math.random() * estradas.length)].split('_').map(Number);
    const carro = document.createElement('div');
    carro.className = 'carro';
    carro.innerHTML = ['🚗','🚕','🚙','🚐'][Math.floor(Math.random()*4)];
    carro.style.left = x * 60 + 20 + 'px';
    carro.style.top = y * 60 + 20 + 'px';
    mapaEl.appendChild(carro);
    carros.push({el: carro, x, y, dir: Math.floor(Math.random()*4), vel: 0.3 + Math.random()*0.3});
  }

  // PEDESTRES
  function spawnPedestre() {
    if (pedestres.length > 20 || populacao < 4) return;
    const x = Math.floor(Math.random() * TAM);
    const y = Math.floor(Math.random() * TAM);
    const pedestre = document.createElement('div');
    pedestre.className = 'pedestre';
    pedestre.innerHTML = ['🚶','🚶‍♀️','🚶‍♂️'][Math.floor(Math.random()*3)];
    pedestre.style.left = x * 60 + 25 + 'px';
    pedestre.style.top = y * 60 + 25 + 'px';
    mapaEl.appendChild(pedestre);
    pedestres.push({el: pedestre, x, y});
  }

  // ANIMAÇÃO
  setInterval(() => {
    carros.forEach(c => {
      const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
      c.x += dirs[c.dir][0] * c.vel;
      c.y += dirs[c.dir][1] * c.vel;
      c.el.style.left = c.x * 60 + 20 + 'px';
      c.el.style.top = c.y * 60 + 20 + 'px';
      c.el.style.transform = `translateZ(5px) rotateZ(${-45 + c.dir*90}deg)`;
      
      if (Math.random() < 0.01) c.dir = Math.floor(Math.random()*4);
      if (c.x < 0 || c.x > TAM-1 || c.y < 0 || c.y > TAM-1) {
        c.el.remove();
        carros = carros.filter(car => car!== c);
      }
    });
    
    pedestres.forEach(p => {
      p.x += (Math.random() - 0.5) * 0.2;
      p.y += (Math.random() - 0.5) * 0.2;
      p.el.style.left = p.x * 60 + 25 + 'px';
      p.el.style.top = p.y * 60 + 25 + 'px';
    });
  }, 50);

  // RENDA
  setInterval(() => {
    let renda = 0;
    Object.values(mapa).forEach(m => {
      const item = ITENS.find(i => i.id === m.item);
      if (item && item.renda) renda += item.renda;
    });
    if (renda > 0) {
      dinheiro += renda;
      atualizarHUD();
    }
    spawnCarro();
    spawnPedestre();
  }, 4000);

  function atualizarHUD() {
    document.getElementById('dinheiro').innerText = `$ ${dinheiro.toLocaleString()}`;
    document.getElementById('populacao').innerText = `👥 ${populacao}`;
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#menu-construir') &&!e.target.closest('.tile')) fecharMenu();
  });

  atualizarHUD();
</script>
</body>
</html>
