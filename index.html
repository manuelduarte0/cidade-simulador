<!DOCTYPE html>
<html>
<head>
  <title>City Builder 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: Arial; background: #87CEEB; overflow: hidden; touch-action: none; }
    
    #viewport {
      position: fixed; width: 100vw; height: 100vh; 
      perspective: 800px; overflow: hidden;
    }
    
    #camera {
      position: absolute; top: 50%; left: 50%;
      transform-style: preserve-3d;
      transform: translate3d(-50%, -50%, 0) rotateX(60deg) rotateZ(45deg);
    }
    
    #mundo {
      position: relative;
      transform-style: preserve-3d;
    }
    
.tile {
      position: absolute; width: 80px; height: 80px;
      background: #4a7c2c; 
      border: 1px solid #3a6c1c;
      transform: translateZ(0px);
    }
.tile.vazio:active { filter: brightness(1.5); }
    
.tile.estrada { 
      background: #2a2a2a; 
      box-shadow: inset 0 0 0 1px #1a1a1a;
    }
.tile.estrada::after {
      content: ''; position: absolute; top: 50%; left: 20%; right: 20%;
      height: 4px; background: #FFD700; transform: translateY(-50%);
    }
    
.building {
      position: absolute; width: 80px; height: 80px;
      transform-style: preserve-3d; pointer-events: none;
    }
    
    /* Cubo 3D de verdade */
.cube { position: absolute; width: 80px; height: 80px; transform-style: preserve-3d; }
.cube.face {
      position: absolute; width: 80px; height: 80px;
      background: rgba(100,100,100,0.9); border: 2px solid #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
    }
.cube.top { transform: rotateX(90deg) translateZ(40px); background: #666; }
.cube.front { transform: translateZ(40px); background: linear-gradient(#888, #666); }
.cube.right { transform: rotateY(90deg) translateZ(40px); background: linear-gradient(#777, #555); }
.cube.back { transform: rotateY(180deg) translateZ(40px); background: #555; }
.cube.left { transform: rotateY(-90deg) translateZ(40px); background: #666; }
.cube.bottom { transform: rotateX(-90deg) translateZ(40px); background: #444; }
    
    /* Altura dos prédios */
.building.casa.cube { height: 80px; }
.building.casa.front,.building.casa.right,.building.casa.back,.building.casa.left { height: 80px; }
.building.casa.top { transform: rotateX(90deg) translateZ(40px) translateY(-80px); }
.building.casa.front { transform: translateZ(40px) translateY(-80px); background: linear-gradient(#8B4513, #CD853F); }
.building.casa.right { transform: rotateY(90deg) translateZ(40px) translateY(-80px); background: linear-gradient(#654321, #A0522D); }
    
.building.predio.cube { height: 240px; }
.building.predio.front,.building.predio.right,.building.predio.back,.building.predio.left { height: 240px; }
.building.predio.top { transform: rotateX(90deg) translateZ(40px) translateY(-240px); background: #0e3a88; }
.building.predio.front { transform: translateZ(40px) translateY(-240px); background: linear-gradient(#1e5aa8, #4a9eff); }
.building.predio.right { transform: rotateY(90deg) translateZ(40px) translateY(-240px); background: linear-gradient(#0e4a98, #3a8eee); }
    
.building.hospital.cube { height: 120px; }
.building.hospital.front,.building.hospital.right,.building.hospital.back,.building.hospital.left { height: 120px; }
.building.hospital.top { transform: rotateX(90deg) translateZ(40px) translateY(-120px); background: #F00; }
.building.hospital.front { transform: translateZ(40px) translateY(-120px); background: linear-gradient(#DDD, #FFF); }
.building.hospital.right { transform: rotateY(90deg) translateZ(40px) translateY(-120px); background: linear-gradient(#CCC, #EEE); }
    
.building.hotel.cube { height: 200px; }
.building.hotel.front,.building.hotel.right,.building.hotel.back,.building.hotel.left { height: 200px; }
.building.hotel.top { transform: rotateX(90deg) translateZ(40px) translateY(-200px); background: #6B006B; }
.building.hotel.front { transform: translateZ(40px) translateY(-200px); background: linear-gradient(#8B008B, #DA70D6); }
.building.hotel.right { transform: rotateY(90deg) translateZ(40px) translateY(-200px); background: linear-gradient(#7B007B, #CA60C6); }
    
.carro {
      position: absolute; font-size: 24px; z-index: 100;
      transform: translateZ(5px) rotateZ(-45deg);
      transition: all 0.15s linear; pointer-events: none;
    }
.pedestre {
      position: absolute; font-size: 18px; z-index: 90;
      transform: translateZ(2px) rotateZ(-45deg);
      transition: all 0.8s linear; pointer-events: none;
    }

    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 200;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    #dinheiro, #populacao {
      background: rgba(0,0,0,0.9); padding: 14px 20px; border-radius: 14px; 
      font-weight: bold; border: 3px solid #0F0; backdrop-filter: blur(10px);
      pointer-events: all; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #dinheiro { color: #0F0; font-size: 24px; }
    #populacao { color: #FFF; font-size: 20px; border-color: #FFF; }
    
    #btn-comprar {
      position: fixed; bottom: 30px; right: 30px; z-index: 200;
      width: 85px; height: 85px; background: #4CAF50; 
      border: 5px solid #FFF; border-radius: 50%; font-size: 45px; 
      color: white; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    #btn-comprar:active { transform: scale(0.9); }
    
    #loja {
      position: fixed; bottom: -100%; left: 0; right: 0; z-index: 300;
      background: #1a1a2e; height: 75vh; border-radius: 25px 25px 0 0;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
      overflow-y: auto; padding: 25px;
    }
    #loja.aberta { bottom: 0; }
    #loja-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: white; }
    #fechar-loja { background: #f44336; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 28px; }
    
.item-loja {
      background: #0f0f1e; padding: 20px; margin: 14px 0; border-radius: 14px; 
      display: flex; align-items: center; gap: 20px; border: 3px solid #333;
    }
.item-loja:active { background: #2a2a4e; transform: scale(0.98); }
.item-emoji { font-size: 52px; }
.item-info { flex: 1; color: white; }
.item-nome { font-size: 22px; font-weight: bold; }
.item-preco { color: #0F0; font-size: 20px; margin-top: 4px; }
.item-desc { color: #AAA; font-size: 14px; margin-top: 6px; }
    
    #menu-construir {
      position: fixed; background: rgba(0,0,0,0.95); padding: 20px;
      border-radius: 14px; z-index: 250; display: none;
      border: 4px solid #4CAF50; backdrop-filter: blur(12px);
    }
    #menu-construir button {
      display: block; width: 240px; padding: 16px; margin: 10px 0;
      background: #4CAF50; color: white; border: none; border-radius: 10px;
      font-size: 18px; font-weight: bold;
    }
    #menu-construir button:active { background: #45a049; }
    
    #toast {
      position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
      background: #f44336; color: white; padding: 14px 28px;
      border-radius: 28px; z-index: 400; display: none; font-weight: bold;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="camera">
      <div id="mundo"></div>
    </div>
  </div>

  <div id="hud">
    <div id="dinheiro">$ 1.000</div>
    <div id="populacao">👥 0</div>
  </div>

  <button id="btn-comprar">🏗️</button>
  <div id="toast"></div>

  <div id="loja">
    <div id="loja-header">
      <h2>Loja de Construção</h2>
      <button id="fechar-loja">×</button>
    </div>
    <div id="lista-itens"></div>
  </div>

  <div id="menu-construir">
    <button onclick="construirAqui('estrada')">🛣️ Estrada</button>
    <button onclick="abrirLojaNoTile()">🏢 Edifício</button>
    <button onclick="fecharMenu()">Cancelar</button>
  </div>

<script>
  const ITENS = [
    { id: 'estrada', nome: 'Estrada', emoji: '🛣️', preco: 10, desc: 'Conecta a cidade', tipo: 'infra' },
    { id: 'casa', nome: 'Casa', emoji: '🏠', preco: 100, desc: '+4 população', tipo: 'res', pop: 4 },
    { id: 'predio', nome: 'Prédio', emoji: '🏢', preco: 500, desc: '+20 população', tipo: 'res', pop: 20 },
    { id: 'escola', nome: 'Escola', emoji: '🏫', preco: 800, desc: 'Educação', tipo: 'serv' },
    { id: 'hospital', nome: 'Hospital', emoji: '🏥', preco: 1200, desc: 'Saúde', tipo: 'serv' },
    { id: 'delegacia', nome: 'Delegacia', emoji: '🚓', preco: 900, desc: 'Segurança', tipo: 'serv' },
    { id: 'hotel', nome: 'Hotel', emoji: '🏨', preco: 1500, desc: '+$50/dia', tipo: 'com', renda: 50 },
    { id: 'lanchonete', nome: 'Lanchonete', emoji: '🍔', preco: 300, desc: '+$20/dia', tipo: 'com', renda: 20 },
    { id: 'restaurante', nome: 'Restaurante', emoji: '🍽️', preco: 600, desc: '+$40/dia', tipo: 'com', renda: 40 },
    { id: 'fazenda', nome: 'Fazenda', emoji: '🚜', preco: 400, desc: '+$30/dia', tipo: 'com', renda: 30 },
    { id: 'estadio', nome: 'Estádio', emoji: '🏟️', preco: 5000, desc: '+$200/dia', tipo: 'lazer', renda: 200 }
  ];

  let dinheiro = 1000, populacao = 0, mapa = {};
  let tileSelecionado = null, carros = [], pedestres = [];

  const cameraEl = document.getElementById('camera');
  const mundoEl = document.getElementById('mundo');
  let scale = 0.7, rotZ = 45, posX = 0, posY = 0;
  let isDragging = false, startX, startY;

  function updateCamera() {
    cameraEl.style.transform = `translate3d(-50%, -50%, 0) rotateX(60deg) rotateZ(${rotZ}deg) translate3d(${posX}px, ${posY}px, 0) scale(${scale})`;
  }
  updateCamera();

  // Grid 25x25
  const TAM = 25;
  for(let i = 0; i < TAM; i++) {
    for(let j = 0; j < TAM; j++) {
      const tile = document.createElement('div');
      tile.className = 'tile vazio';
      tile.style.left = i * 80 + 'px';
      tile.style.top = j * 80 + 'px';
      tile.dataset.x = i;
      tile.dataset.y = j;
      tile.onclick = (e) => clicarTile(i, j, e);
      mundoEl.appendChild(tile);
    }
  }

  // Controles
  mundoEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      startX = e.touches[0].clientX - posX;
      startY = e.touches[0].clientY - posY;
    }
  });
  
  let lastDist = 0;
  mundoEl.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      posX = e.touches[0].clientX - startX;
      posY = e.touches[0].clientY - startY;
      updateCamera();
    }
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (lastDist) {
        scale *= dist / lastDist;
        scale = Math.max(0.3, Math.min(1.3, scale));
        updateCamera();
      }
      lastDist = dist;
    }
  });
  
  mundoEl.addEventListener('touchend', () => {
    isDragging = false;
    lastDist = 0;
  });

  function clicarTile(tx, ty, e) {
    if (isDragging) return;
    e.stopPropagation();
    tileSelecionado = {x: tx, y: ty};
    
    const key = `${tx}_${ty}`;
    if (mapa[key]) return mostrarToast('Terreno ocupado!');
    
    const menu = document.getElementById('menu-construir');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
  }

  function fecharMenu() {
    document.getElementById('menu-construir').style.display = 'none';
  }

  function construirAqui(tipo) {
    fecharMenu();
    if (tipo === 'estrada') construir('estrada', tileSelecionado.x, tileSelecionado.y);
  }

  function abrirLojaNoTile() {
    fecharMenu();
    abrirLoja();
  }

  // LOJA
  const lojaEl = document.getElementById('loja');
  document.getElementById('btn-comprar').onclick = abrirLoja;
  document.getElementById('fechar-loja').onclick = () => lojaEl.classList.remove('aberta');

  function abrirLoja() {
    lojaEl.classList.add('aberta');
    renderizarLoja();
  }

  function renderizarLoja() {
    const lista = document.getElementById('lista-itens');
    lista.innerHTML = '';
    ITENS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item-loja';
      div.innerHTML = `
        <div class="item-emoji">${item.emoji}</div>
        <div class="item-info">
          <div class="item-nome">${item.nome}</div>
          <div class="item-preco">$ ${item.preco}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
      `;
      div.onclick = () => {
        if (tileSelecionado) {
          construir(item.id, tileSelecionado.x, tileSelecionado.y);
          lojaEl.classList.remove('aberta');
        } else {
          mostrarToast('Clica no terreno primeiro!');
        }
      };
      lista.appendChild(div);
    });
  }

  // CONSTRUIR CUBO 3D
  function construir(itemId, tx, ty) {
    const item = ITENS.find(i => i.id === itemId);
    const key = `${tx}_${ty}`;
    
    if (mapa[key]) return mostrarToast('Terreno ocupado!');
    if (dinheiro < item.preco) return mostrarToast('Dinheiro insuficiente!');
    
    dinheiro -= item.preco;
    mapa[key] = { tipo: item.tipo, item: itemId };
    if (item.pop) populacao += item.pop;
    
    const tile = document.querySelector(`[data-x="${tx}"][data-y="${ty}"]`);
    
    if (itemId === 'estrada') {
      tile.className = 'tile estrada';
    } else {
      const building = document.createElement('div');
      building.className = `building ${itemId}`;
      building.style.left = tx * 80 + 'px';
      building.style.top = ty * 80 + 'px';
      
      building.innerHTML = `
        <div class="cube">
          <div class="face top"></div>
          <div class="face front">${item.emoji}</div>
          <div class="face right"></div>
          <div class="face back"></div>
          <div class="face left"></div>
          <div class="face bottom"></div>
        </div>
      `;
      mundoEl.appendChild(building);
      tile.className = 'tile ocupado';
    }
    
    atualizarHUD();
    spawnCarro();
    spawnPedestre();
  }

  // CARROS
  function spawnCarro() {
    if (carros.length > 20) return;
    const estradas = Object.keys(mapa).filter(k => mapa[k].tipo === 'infra');
    if (estradas.length < 2) return;
    
    const [x, y] = estradas[Math.floor(Math.random() * estradas.length)].split('_').map(Number);
    const carro = document.createElement('div');
    carro.className = 'carro';
    carro.innerHTML = ['🚗','🚕','🚙','🚐','🚛'][Math.floor(Math.random()*5)];
    carro.style.left = x * 80 + 40 + 'px';
    carro.style.top = y * 80 + 40 + 'px';
    mundoEl.appendChild(carro);
    carros.push({el: carro, x, y, vel: 0.5 + Math.random()*0.5});
  }

  // PEDESTRES
  function spawnPedestre() {
    if (pedestres.length > 30 || populacao < 4) return;
    const x = Math.floor(Math.random() * TAM);
    const y = Math.floor(Math.random() * TAM);
    const pedestre = document.createElement('div');
    pedestre.className = 'pedestre';
    pedestre.innerHTML = ['🚶','🚶‍♀️','🚶‍♂️'][Math.floor(Math.random()*3)];
    pedestre.style.left = x * 80 + 40 + 'px';
    pedestre.style.top = y * 80 + 40 + 'px';
    mundoEl.appendChild(pedestre);
    pedestres.push({el: pedestre, x, y});
  }

  // ANIMAÇÃO
  setInterval(() => {
    carros.forEach(c => {
      c.x += (Math.random() - 0.5) * c.vel;
      c.y += (Math.random() - 0.5) * c.vel;
      c.el.style.left = c.x * 80 + 40 + 'px';
      c.el.style.top = c.y * 80 + 40 + 'px';
      
      if (c.x < 0 || c.x > TAM-1 || c.y < 0 || c.y > TAM-1) {
        c.el.remove();
        carros = carros.filter(car => car!== c);
      }
    });
    
    pedestres.forEach(p => {
      p.x += (Math.random() - 0.5) * 0.2;
      p.y += (Math.random() - 0.5) * 0.2;
      p.el.style.left = p.x * 80 + 40 + 'px';
      p.el.style.top = p.y * 80 + 40 + 'px';
    });
  }, 60);

  // RENDA
  setInterval(() => {
    let renda = 0;
    Object.values(mapa).forEach(m => {
      const item = ITENS.find(i => i.id === m.item);
      if (item && item.renda) renda += item.renda;
    });
    if (renda > 0) {
      dinheiro += renda;
      atualizarHUD();
    }
    spawnCarro();
    spawnPedestre();
  }, 4000);

  function atualizarHUD() {
    document.getElementById('dinheiro').innerText = `$ ${dinheiro.toLocaleString()}`;
    document.getElementById('populacao').innerText = `👥 ${populacao}`;
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#menu-construir') &&!e.target.closest('.tile')) fecharMenu();
  });

  atualizarHUD();
</script>
</body>
</html>
